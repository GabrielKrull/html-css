<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border: 1px solid black;
            border-collapse: collapse;
            padding: 5px;
        }

        th,tr,td{
            border: 1px solid black;
            border-collapse: collapse;
            padding: 5px;
        }
        #semnada{
            text-align: left;
            border: 0px;
        }

        .pintado{
            background-color: rgb(116, 115, 115);
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr class="pintado">
                <th rowspan="2" class="pintado">Área</th>
                <th rowspan="2" class="pintado">Disciplinas</th>
                <th colspan="2" class="pintado">Notas</th>
                <th rowspan="2" colspan="2" class="pintado">Média</th>
            </tr>
            <tr>
                <th class="pintado">Nota 1</th>
                <th class="pintado">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td colspan="2">0.0</td>

            </tr>
            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td colspan="2">0.0</td>
            </tr>
                <tr>
                    <td>Química</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td colspan="2">0.0</td>
                </tr>
                <tr>
                    <td>Química</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td colspan="2">0.0</td>
                </tr>
            <tr>
                <th id="semnada" class="pintado" colspan="4" >Média de exatas</th>
                <td class="pintado">0.0</td>
            </tr>

            <tr>
                <th rowspan="2">Humanas</th>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td colspan="2">0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td colspan="2">0.0</td>
            </tr>
            
            <tr>
                <th id="semnada" class="pintado" colspan="4">Média de humanas</th>
                <td class="pintado">0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
